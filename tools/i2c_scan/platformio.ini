; M5Dial I2C bus scanner (Port A: 13=SDA, 15=SCL). MCP9808 should show at 0x18.
; Results on screen and serial; BtnA rescans.
[env:m5dial]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.1.13
